<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalyst Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden { display: none; }
  </style>
</head>
<body class="bg-gray-100 font-sans"><header class="bg-white shadow p-4 flex justify-between items-center">
  <div class="flex items-center space-x-2">
    <img src="logo.png" alt="Logo" class="h-10 w-10">
    <span class="text-xl font-bold">CATALYST</span>
  </div>
  <button id="cartBtn">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h18M9 3v18m6-18v18" />
    </svg>
  </button>
</header><div class="bg-cover bg-center h-40 flex items-center justify-center text-white text-3xl font-bold" style="background-image: url('banner.png');">
  WELCOME<br>CATALYST STORE
</div><div class="p-4">
  <input type="text" id="searchInput" placeholder="Cari produk" class="w-full p-2 border rounded">
</div><div class="flex gap-2 justify-center mb-4">
  <button class="category-btn bg-black text-white px-4 py-1 rounded" data-category="all">All</button>
  <button class="category-btn bg-gray-200 px-4 py-1 rounded" data-category="script">SCRIPT BOT</button>
  <button class="category-btn bg-gray-200 px-4 py-1 rounded" data-category="website">WEBSITE</button>
  <button class="category-btn bg-gray-200 px-4 py-1 rounded" data-category="jasa">JASA</button>
</div><div id="productGrid" class="flex flex-col space-y-4 px-4">
  <div class="product bg-white rounded shadow flex flex-col md:flex-row items-center md:items-start p-4 space-y-2 md:space-y-0 md:space-x-4" data-category="script">
    <img src="produk1.png" alt="Produk 1" class="rounded w-full md:w-40 h-40 object-cover">
    <div class="text-center md:text-left">
      <h2 class="text-lg font-semibold">SC BOT AUTOORDER V1.3.0</h2>
      <p class="text-pink-600 font-bold mt-1">Rp. 60.000</p>
    </div>
  </div>  <div class="product bg-white rounded shadow flex flex-col md:flex-row items-center md:items-start p-4 space-y-2 md:space-y-0 md:space-x-4" data-category="jasa">
    <img src="produk2.png" alt="Panel" class="rounded w-full md:w-40 h-40 object-cover">
    <div class="text-center md:text-left">
      <h2 class="text-lg font-semibold">JASA INSTALL PANEL</h2>
      <p class="text-pink-600 font-bold mt-1">Rp. 10.000</p>
    </div>
  </div>  <div class="product bg-white rounded shadow flex flex-col md:flex-row items-center md:items-start p-4 space-y-2 md:space-y-0 md:space-x-4" data-category="website">
    <img src="produk3.png" alt="Webstore" class="rounded w-full md:w-40 h-40 object-cover">
    <div class="text-center md:text-left">
      <h2 class="text-lg font-semibold">SCRIPT WEBSITE STORE</h2>
      <p class="line-through text-gray-500 mt-1">Rp. 300.000</p>
      <p class="text-pink-600 font-bold">Rp. 201.000</p>
    </div>
  </div>  <div class="product bg-white rounded shadow flex flex-col md:flex-row items-center md:items-start p-4 space-y-2 md:space-y-0 md:space-x-4" data-category="script">
    <img src="produk4.png" alt="Bot Auto Order" class="rounded w-full md:w-40 h-40 object-cover">
    <div class="text-center md:text-left">
      <h2 class="text-lg font-semibold">SCRIPT BOT AUTO ORDER</h2>
      <p class="line-through text-gray-500 mt-1">Rp. 40.000</p>
      <p class="text-pink-600 font-bold">Rp. 30.000</p>
    </div>
  </div>
</div><div class="fixed bottom-4 left-4 bg-white shadow-lg rounded-full flex items-center space-x-2 p-2">
  <img src="user.png" class="rounded-full w-10 h-10" alt="User">
  <div>
    <p class="text-sm">ryza membeli</p>
    <p class="font-semibold text-sm">SC BOT AUTOORDER V1.3.0</p>
  </div>
</div><script>
const buttons = document.querySelectorAll('.category-btn');
const products = document.querySelectorAll('.product');
buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    buttons.forEach(b => b.classList.remove('bg-black', 'text-white'));
    btn.classList.add('bg-black', 'text-white');
    const cat = btn.dataset.category;
    products.forEach(p => {
      if (cat === 'all' || p.dataset.category === cat) {
        p.classList.remove('hidden');
      } else {
        p.classList.add('hidden');
      }
    });
  });
});

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase();
  products.forEach(p => {
    const name = p.querySelector('h2').textContent.toLowerCase();
    p.style.display = name.includes(query) ? '' : 'none';
  });
});
</script></body>
</html>
